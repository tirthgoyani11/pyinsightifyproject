<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 - Page Not Found | Insightify</title>
  
  <link rel="stylesheet" href="css/design-system.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/pages.css">
</head>
<body>
  
  <div style="min-height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; padding: var(--space-6);">
    
    <div style="max-width: 600px;">
      
      <!-- 404 Icon -->
      <div style="font-size: 8rem; margin-bottom: var(--space-6);">🔍</div>
      
      <!-- Error Message -->
      <h1 style="font-size: 3rem; margin-bottom: var(--space-4); color: var(--color-primary);">404</h1>
      <h2 style="margin-bottom: var(--space-4);">Oops! Page Not Found</h2>
      <p class="text-secondary" style="font-size: 1.125rem; margin-bottom: var(--space-8);">
        We couldn't find the page you're looking for. It might have been moved, deleted, or never existed.
      </p>
      
      <!-- Action Buttons -->
      <div style="display: flex; gap: var(--space-4); justify-content: center; flex-wrap: wrap;">
        <a href="index.html" class="btn btn-primary btn-lg">
          Go to Homepage
        </a>
        <a href="browse.html" class="btn btn-outline btn-lg">
          Browse Products
        </a>
      </div>
      
      <!-- Quick Links -->
      <div style="margin-top: var(--space-10); padding-top: var(--space-8); border-top: 1px solid var(--color-border);">
        <p class="text-secondary" style="margin-bottom: var(--space-4);">Quick Links:</p>
        <div style="display: flex; gap: var(--space-4); justify-content: center; flex-wrap: wrap;">
          <a href="submit.html" style="color: var(--color-primary);">Analyze Product</a>
          <span style="color: var(--color-border);">|</span>
          <a href="community.html" style="color: var(--color-primary);">Community</a>
          <span style="color: var(--color-border);">|</span>
          <a href="index.html#features" style="color: var(--color-primary);">Features</a>
          <span style="color: var(--color-border);">|</span>
          <a href="index.html#how-it-works" style="color: var(--color-primary);">How It Works</a>
        </div>
      </div>
      
    </div>
    
  </div>
  
</body>
</html>
