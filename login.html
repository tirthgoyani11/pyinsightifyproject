        .auth-container {
            max-width: 450px;
            margin: 60px auto;
            padding: 40px;
            background: var(--surface);
            border-radius: 16px;
            box-shadow: var(--shadow-lg);
        }

        .auth-header {
            text-align: center;
            margin-bottom: 32px;
        }

        .auth-header h1 {
            color: #1f2937;
            margin-bottom: 8px;
            font-size: 2rem;
            font-weight: 800;
        }

        .auth-header p {
            color: #4b5563;
            font-size: 1rem;
            font-weight: 500;
        }

        .auth-form {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .form-group label {
            color: #1f2937;
            font-weight: 600;
            font-size: 0.95rem;
        }

        .form-group input {
            padding: 12px 16px;
            border: 2px solid #d1d5db;
            border-radius: 8px;
            font-size: 1rem;
            transition: all 0.3s ease;
            background: white;
            color: #1f2937;
        }

        .form-group input:focus {
            outline: none;
            border-color: #6366f1;
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.15);
        }

        .form-group input.error {
            border-color: #ef4444;
        }

        .form-group .error-message {
            color: #dc2626;
            font-size: 0.9rem;
            font-weight: 600;
            display: none;
        }

        .form-group.has-error .error-message {
            display: block;
        }

        .form-options {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.9rem;
        }

        .remember-me {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
        }

        .remember-me input[type="checkbox"] {
            width: 18px;
            height: 18px;
            cursor: pointer;
        }

        .forgot-password {
            color: var(--primary);
            text-decoration: none;
            transition: color 0.3s ease;
        }

        .forgot-password:hover {
            color: var(--primary-dark);
        }

        .submit-btn {
            padding: 14px;
            background: #6366f1;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1.1rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 2px 8px rgba(99, 102, 241, 0.3);
        }

        .submit-btn:hover:not(:disabled) {
            background: #4f46e5;
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(99, 102, 241, 0.4);
        }

        .submit-btn:disabled {
            background: #9ca3af;
            cursor: not-allowed;
            opacity: 0.6;
        }

        .divider {
            display: flex;
            align-items: center;
            text-align: center;
            margin: 24px 0;
        }

        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            border-bottom: 1px solid var(--border);
        }

        .divider span {
            padding: 0 16px;
            color: var(--text-tertiary);
            font-size: 0.9rem;
        }

        .auth-footer {
            text-align: center;
            margin-top: 24px;
            padding-top: 24px;
            border-top: 1px solid var(--border);
        }

        .auth-footer p {
            color: var(--text-secondary);
            font-size: 0.95rem;
        }

        .auth-footer a {
            color: var(--primary);
            text-decoration: none;
            font-weight: 600;
            transition: color 0.3s ease;
        }

        .auth-footer a:hover {
            color: var(--primary-dark);
        }

        .alert {
            padding: 12px 16px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: none;
        }

        .alert.show {
            display: block;
        }

        .alert.error {
            background: #fee2e2;
            border: 2px solid #ef4444;
            color: #991b1b;
            font-weight: 600;
        }

        .alert.success {
            background: #d1fae5;
            border: 2px solid #10b981;
            color: #065f46;
            font-weight: 600;
        }

        .loading-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            z-index: 9999;
            align-items: center;
            justify-content: center;
        }

        .loading-overlay.active {
            display: flex;
        }

        .spinner {
            width: 50px;
            height: 50px;
            border: 4px solid rgba(255, 255, 255, 0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        @media (max-width: 768px) {
            .auth-container {
                margin: 20px;
                padding: 24px;
            }

            .auth-header h1 {
                font-size: 1.5rem;
            }
        }
    </style>

    <!-- Main Content -->
    <main class="container">
        <div class="auth-container">
            <div class="auth-header">
                <h1>Welcome Back</h1>
                <p>Login to your PyInsightify account</p>
            </div>

            <!-- Alert Messages -->
            <div id="alertMessage" class="alert"></div>

            <!-- Login Form -->
            <form id="loginForm" class="auth-form">
                <div class="form-group" id="emailGroup">
                    <label for="email">Email Address</label>
                    <input 
                        type="email" 
                        id="email" 
                        name="email" 
                        placeholder="Enter your email"
                        required
                        autocomplete="email"
                    >
                    <span class="error-message">Please enter a valid email address</span>
                </div>

                <div class="form-group" id="passwordGroup">
                    <label for="password">Password</label>
                    <input 
                        type="password" 
                        id="password" 
                        name="password" 
                        placeholder="Enter your password"
                        required
                        autocomplete="current-password"
                        minlength="6"
                    >
                    <span class="error-message">Password must be at least 6 characters</span>
                </div>

                <div class="form-options">
                    <label class="remember-me">
                        <input type="checkbox" id="rememberMe" name="rememberMe">
                        <span>Remember me</span>
                    </label>
                    <a href="#" class="forgot-password">Forgot password?</a>
                </div>

                <button type="submit" class="submit-btn">Login</button>
            </form>

            <div class="auth-footer">
                <p>Don't have an account? <a href="register.html">Sign up now</a></p>
            </div>
        </div>
    </main>

    <script src="js/api.js?v=2.1"></script>
    <script>
        // Login Form Handler
        const loginForm = document.getElementById('loginForm');
        const emailInput = document.getElementById('email');
        const passwordInput = document.getElementById('password');
        const rememberMeCheckbox = document.getElementById('rememberMe');
        const loadingOverlay = document.getElementById('loadingOverlay');
        const alertMessage = document.getElementById('alertMessage');

        // Show alert message
        function showAlert(message, type = 'error') {
            alertMessage.textContent = message;
            alertMessage.className = `alert ${type} show`;
            setTimeout(() => {
                alertMessage.classList.remove('show');
            }, 5000);
        }

        // Validate email format
        function isValidEmail(email) {
            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            return emailRegex.test(email);
        }

        // Show/hide loading overlay
        function setLoading(isLoading) {
            if (isLoading) {
                loadingOverlay.classList.add('active');
                loginForm.querySelector('.submit-btn').disabled = true;
            } else {
                loadingOverlay.classList.remove('active');
                loginForm.querySelector('.submit-btn').disabled = false;
            }
        }

        // Form validation
        function validateForm() {
            let isValid = true;

            // Validate email
            const emailGroup = document.getElementById('emailGroup');
            if (!emailInput.value || !isValidEmail(emailInput.value)) {
                emailGroup.classList.add('has-error');
                emailInput.classList.add('error');
                isValid = false;
            } else {
                emailGroup.classList.remove('has-error');
                emailInput.classList.remove('error');
            }

            // Validate password
            const passwordGroup = document.getElementById('passwordGroup');
            if (!passwordInput.value || passwordInput.value.length < 6) {
                passwordGroup.classList.add('has-error');
                passwordInput.classList.add('error');
                isValid = false;
            } else {
                passwordGroup.classList.remove('has-error');
                passwordInput.classList.remove('error');
            }

            return isValid;
        }

        // Handle form submission
        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();

            // Validate form
            if (!validateForm()) {
                return;
            }

            setLoading(true);

            try {
                const formData = {
                    email: emailInput.value.trim(),
                    password: passwordInput.value
                };

                console.log('Attempting login for:', formData.email);

                const response = await fetch('http://localhost:5000/api/auth/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    credentials: 'include', // Important for session cookies
                    body: JSON.stringify(formData)
                });

                const data = await response.json();

                if (response.ok) {
                    console.log('Login successful:', data);
                    showAlert('Login successful! Redirecting...', 'success');

                    // Store user info if remember me is checked
                    if (rememberMeCheckbox.checked) {
                        localStorage.setItem('userEmail', formData.email);
                        localStorage.setItem('userId', data.user.id);
                        localStorage.setItem('username', data.user.username);
                    } else {
                        // Store in session storage
                        sessionStorage.setItem('userId', data.user.id);
                        sessionStorage.setItem('username', data.user.username);
                    }

                    // Redirect after 1 second
                    setTimeout(() => {
                        const redirectUrl = new URLSearchParams(window.location.search).get('redirect') || 'browse.html';
                        window.location.href = redirectUrl;
                    }, 1000);
                } else {
                    console.error('Login failed:', data);
                    showAlert(data.error || 'Login failed. Please check your credentials.', 'error');
                    setLoading(false);
                }
            } catch (error) {
                console.error('Login error:', error);
                showAlert('An error occurred. Please try again later.', 'error');
                setLoading(false);
            }
        });

        // Real-time validation
        emailInput.addEventListener('blur', () => {
            const emailGroup = document.getElementById('emailGroup');
            if (emailInput.value && !isValidEmail(emailInput.value)) {
                emailGroup.classList.add('has-error');
                emailInput.classList.add('error');
            } else {
                emailGroup.classList.remove('has-error');
                emailInput.classList.remove('error');
            }
        });

        passwordInput.addEventListener('blur', () => {
            const passwordGroup = document.getElementById('passwordGroup');
            if (passwordInput.value && passwordInput.value.length < 6) {
                passwordGroup.classList.add('has-error');
                passwordInput.classList.add('error');
            } else {
                passwordGroup.classList.remove('has-error');
                passwordInput.classList.remove('error');
            }
        });

        // Pre-fill email if remembered
        window.addEventListener('DOMContentLoaded', () => {
            const rememberedEmail = localStorage.getItem('userEmail');
            if (rememberedEmail) {
                emailInput.value = rememberedEmail;
                rememberMeCheckbox.checked = true;
            }
        });
    </script>
